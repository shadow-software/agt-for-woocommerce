name: CI

# The full quality gate — coding standards, static analysis, unit tests, and the
# official WordPress.org Plugin Check — runs on every push and pull request.
#
# Note on PHP versions: the plugin RUNTIME requires PHP 8.1+ (agt-php-sdk),
# enforced by PHPCompatibility and PHPStan. Dev tooling (PHPUnit 11) needs 8.2+,
# so CI runs on 8.2 and 8.3.
on:
  push:
    branches: [ production, main, master ]
  pull_request:
    branches: [ production, main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Analyse · Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          elif [ -n "$COMPOSER_AUTH" ]; then
            echo "$COMPOSER_AUTH" > "$HOME/.composer/auth.json"
          fi
          composer install --prefer-dist --no-progress --no-interaction

      - name: Lint — WordPress Coding Standards + PHP 8.1 compatibility
        run: composer lint

      - name: Static analysis — PHPStan (level 6)
        run: composer stan

      - name: Unit tests — PHPUnit
        run: composer test

  # PHP 8.1 syntax gate — minimum supported runtime.
  php81-syntax:
    name: PHP 8.1 syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: php -l on every PHP file (excluding vendor)
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse on PHP 8.1."

  # The official WordPress.org Plugin Check — the exact automated gate the
  # directory runs. Built into the release layout first (composer --no-dev +
  # distignore), then checked at the strictest settings.
  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install runtime dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Build the release layout
        run: |
          set -euo pipefail
          slug=agt-sync-for-woocommerce
          dest="${{ runner.temp }}/${slug}"
          mkdir -p "$dest"
          # Copy runtime tree; honour .distignore by rsync exclude-from.
          rsync -a --exclude-from=.distignore ./ "$dest/"
          # Ensure vendor landed (runtime SDK).
          test -f "$dest/vendor/autoload.php"
          echo "PLUGIN_DIR=$dest" >> "$GITHUB_ENV"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ env.PLUGIN_DIR }}
          slug: agt-sync-for-woocommerce
          severity: 0
          include-experimental: true
          include-low-severity-errors: true
          include-low-severity-warnings: true
