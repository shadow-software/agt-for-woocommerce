name: Bump agt-php-sdk

# Closes the last manual step in the release chain: dealer API change ->
# agt-php-sdk release -> (here) this plugin picks it up automatically.
# agt-php-sdk's release.yml uses shadow-software/sdk-release's built-in
# consumer_repo mechanism, which fires repository_dispatch (sdk-updated) to
# this repo after a real publish. This job updates the Composer dependency
# and, only if that actually changed anything, bumps the plugin's own version
# and pushes a tag — which is exactly the trigger release.yml (GitHub
# Release) and deploy.yml (WordPress.org SVN) already listen for. No release
# logic is duplicated here.
#
# sdk-updated is a generic event name shared by every SDK in the
# shadow-software org that declares a consumer_repo, not one this repo
# invented — the package filter in "Resolve the dispatched SDK version"
# below is what scopes it to agt-php-sdk specifically.
#
# workflow_dispatch exists to dry-run against an already-published SDK version
# without waiting for a new one, or to replay a dispatch that arrived while
# this workflow didn't exist yet.
on:
  repository_dispatch:
    types: [sdk-updated]
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "agt-php-sdk version to pick up, e.g. 0.2.9"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-sdk
  cancel-in-progress: false

jobs:
  bump:
    name: Update SDK dependency and release if changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Resolve the dispatched SDK version
        id: sdk
        run: |
          set -euo pipefail
          package="${{ github.event.client_payload.package }}"
          if [ -n "$package" ] && [ "$package" != "shadow-software/agt-php-sdk" ]; then
            echo "::notice::sdk-updated dispatch was for ${package}, not agt-php-sdk — nothing for this repo to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${{ github.event.client_payload.version || inputs.sdk_version }}"
          if [ -z "$version" ]; then
            echo "::error::No SDK version in the dispatch payload or workflow input."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Record the currently locked agt-php-sdk version
        id: before
        if: steps.sdk.outputs.skip != 'true'
        run: |
          set -euo pipefail
          before="$(jq -r '.packages[] | select(.name=="shadow-software/agt-php-sdk") | .version' composer.lock)"
          echo "version=${before}" >> "$GITHUB_OUTPUT"

      - name: Update the agt-php-sdk Composer dependency
        if: steps.sdk.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          IFS='.' read -r major minor _patch <<< "$SDK_VERSION"
          if [ "$major" = "0" ]; then
            constraint="^${major}.${minor}"
          else
            constraint="^${major}.0"
          fi
          composer require "shadow-software/agt-php-sdk:${constraint}" --no-update --no-interaction
          locked_version=""
          for attempt in 1 2 3 4 5; do
            composer update shadow-software/agt-php-sdk --no-interaction --no-progress --with-all-dependencies
            locked_version="$(jq -r '.packages[] | select(.name=="shadow-software/agt-php-sdk") | .version' composer.lock)"
            if [ "$locked_version" = "$SDK_VERSION" ]; then
              break
            fi
            echo "Attempt ${attempt}: composer resolved ${locked_version:-<none>}, waiting for Packagist to index ${SDK_VERSION}..."
            sleep 15
          done
          if [ "$locked_version" != "$SDK_VERSION" ]; then
            echo "::warning::Composer never resolved exactly ${SDK_VERSION} (got '${locked_version:-<none>}') after 5 attempts."
          fi

      # Diffs the actually-resolved package version rather than the raw
      # composer.lock/composer.json bytes: composer.lock's content-hash
      # changes whenever composer.json does, even when nothing resolved
      # differently, which would otherwise flip this to "changed" and cut a
      # release with nothing in it. A same-version dispatch (a re-run, or a
      # dispatch that arrives after a human already bumped the plugin) must
      # be a clean no-op.
      - name: Stop here if the locked SDK version didn't actually change
        id: diff
        if: steps.sdk.outputs.skip != 'true'
        run: |
          set -euo pipefail
          after="$(jq -r '.packages[] | select(.name=="shadow-software/agt-php-sdk") | .version' composer.lock)"
          if [ "${{ steps.before.outputs.version }}" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "agt-php-sdk is already locked at ${after} — nothing to release."
            git checkout -- composer.json composer.lock
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "agt-php-sdk ${{ steps.before.outputs.version }} -> ${after}"
          fi

      - name: Bump the plugin version (patch)
        id: bump
        if: steps.diff.outputs.changed == 'true'
        run: |
          new_version="$(bash .github/scripts/bump-plugin-version.sh "${{ steps.sdk.outputs.version }}")"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "sdk-dispatch-bot"
          git config user.email "noreply@shadowsoftware.com"
          git add composer.json composer.lock agt-sync-for-woocommerce.php readme.txt
          git commit -m "chore: bump agt-php-sdk to ${{ steps.sdk.outputs.version }}, release ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin HEAD "${{ steps.bump.outputs.version }}"

      - name: Trigger the release workflow
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "${NEW_VERSION}" -f tag="${NEW_VERSION}"; then
              echo "Triggered release.yml for ${NEW_VERSION}."
              exit 0
            fi
            echo "Attempt ${attempt}: release.yml dispatch failed, retrying..."
            sleep 5
          done
          echo "::warning::Could not trigger release.yml for ${NEW_VERSION} after 3 attempts. Re-run release.yml manually with workflow_dispatch."

      # GITHUB_TOKEN tag pushes do not trigger deploy.yml either — dispatch it
      # explicitly. deploy.yml no-ops when SVN secrets are unset.
      - name: Trigger the WordPress.org deploy workflow
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --ref "${NEW_VERSION}"; then
              echo "Triggered deploy.yml for ${NEW_VERSION}."
              exit 0
            fi
            echo "Attempt ${attempt}: deploy.yml dispatch failed, retrying..."
            sleep 5
          done
          echo "::warning::Could not trigger deploy.yml for ${NEW_VERSION} after 3 attempts. Re-run deploy.yml manually with workflow_dispatch."
